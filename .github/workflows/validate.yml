name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security gate (no credentials)
        run: bash scripts/security-gate.sh

      - name: Config parseability
        run: bash scripts/validate.sh

      - name: Set up Node for Lite healthcheck
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Lite healthcheck tests
        run: node --test test/lite-health.test.mjs

      - name: Lite healthcheck
        run: node scripts/lite-health.mjs

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
